{% if page.has_other_pages %}
<nav class="pagination" aria-label="Sayfalar">
  {% if page.has_previous %}
    <a class="btn btn--secondary" href="?sayfa={{ page.previous_page_number }}">← Yeni anketler</a>
  {% else %}
    <span></span>
  {% endif %}
  <span class="muted">Sayfa {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a class="btn btn--secondary" href="?sayfa={{ page.next_page_number }}">Eski anketler →</a>
  {% else %}
    <span></span>
  {% endif %}
</nav>
{% endif %}
