{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kararsızım — Sor, millet karar versin{% endblock %}</title>
  <meta name="description" content="Kararsız mısın? Sor, millet karar versin.">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="/" aria-label="kararsızım ana sayfa">kararsızım<span class="logo__mark">?</span></a>
      <nav class="site-header__nav" aria-label="Ana menü">
        {% block header_nav %}{% endblock %}
      </nav>
    </div>
  </header>

  <main class="container" id="icerik">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>kararsızım · Kararsız mısın? Sor, millet karar versin.</p>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
